<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="InfraAnchor IA">
  <defs>
    <linearGradient id="tile" x1="8" y1="4" x2="58" y2="63" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172747"/><stop offset="1" stop-color="#2d4a78"/>
    </linearGradient>
    <linearGradient id="arc" x1="14" y1="20" x2="45" y2="17" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4d8fff"/><stop offset="1" stop-color="#a4d8ff"/>
    </linearGradient>
    <filter id="iaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0" result="blur">
        <animate attributeName="stdDeviation" values="0;0;1.1;0" keyTimes="0;.72;.82;1" dur="3.2s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#tile)" stroke="#6386bd" stroke-width="1.3"/>
  <path d="M14 20.5C20 9.5 36 6.8 45 17" fill="none" stroke="url(#arc)" stroke-width="2.7" stroke-linecap="round"/>
  <path pathLength="100" d="M14 20.5C20 9.5 36 6.8 45 17" fill="none" stroke="#eaf5ff" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="8 100" opacity="0" filter="drop-shadow(0 0 2px #d8f1ff)">
    <animate attributeName="stroke-dashoffset" values="0;0;-100;-100;0" keyTimes="0;.16;.76;.9;1" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.16;.76;.9;1" dur="3.2s" repeatCount="indefinite"/>
  </path>
  <circle cx="45" cy="17" r="2.4" fill="#a4d8ff" filter="drop-shadow(0 0 3px #a4d8ff88)">
    <animate attributeName="opacity" values=".55;.55;1;.55" keyTimes="0;.72;.82;1" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2.1;2.1;2.8;2.1" keyTimes="0;.72;.82;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <g filter="url(#iaGlow)">
    <text x="11" y="46" fill="#fff" font-family="Arial,sans-serif" font-size="31" font-weight="800" letter-spacing="-4">I</text>
    <text x="25" y="46" fill="#a4d8ff" font-family="Arial,sans-serif" font-size="31" font-weight="800" letter-spacing="-2">A</text>
  </g>
</svg>
