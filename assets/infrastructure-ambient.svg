<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="atmosphere" cx="52%" cy="46%" r="70%">
      <stop offset="0" stop-color="#397de0" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#5b49c4" stop-opacity=".1"/>
      <stop offset="1" stop-color="#080b14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="network-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#69ddff" stop-opacity=".78"/>
      <stop offset=".52" stop-color="#78a8ff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#a696ff" stop-opacity=".62"/>
    </linearGradient>
    <filter id="light-glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mesh{fill:none;stroke:url(#network-stroke);stroke-width:1.25;stroke-opacity:.62;stroke-dasharray:2 12;animation:signal-drift 34s linear infinite}
    .mesh:nth-of-type(even){animation-direction:reverse;animation-duration:43s}
    .thread{fill:none;stroke:#8d9fff;stroke-width:.85;stroke-opacity:.3;stroke-dasharray:1 15}
    .orbit{fill:none;stroke:#83baff;stroke-width:1;stroke-opacity:.36;stroke-dasharray:2 14}
    .icon-shell{fill:#101d36;fill-opacity:.52;stroke:#91caff;stroke-opacity:.69;stroke-width:1.3}
    .icon{fill:none;stroke:#b9e4ff;stroke-opacity:.78;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
    .pin{fill:#b9edff;filter:url(#light-glow)}
    .pin-teal{fill:#83f1da;filter:url(#light-glow)}
    .traveller{filter:url(#light-glow)}
    @keyframes signal-drift{to{stroke-dashoffset:-168}}
    @keyframes pulse{0%,100%{opacity:.48}50%{opacity:1}}
    .pulse{animation:pulse 3.8s ease-in-out infinite}
    @media(prefers-reduced-motion:reduce){.mesh,.pulse{animation:none}.traveller{display:none}}
  </style>
  <ellipse cx="600" cy="425" rx="575" ry="415" fill="url(#atmosphere)"/>

  <!-- Wide, interwoven routes form one shared infrastructure backdrop. -->
  <g>
    <path class="mesh" d="M-60 595 C160 490 285 315 470 350 S750 560 925 430 S1110 280 1260 345"/>
    <path class="mesh" d="M-45 238 C185 300 285 512 468 530 S750 298 916 238 S1112 158 1260 130"/>
    <path class="mesh" d="M118 28 C254 273 326 601 570 758 S850 805 1065 589"/>
    <path class="mesh" d="M200 814 C360 665 508 230 714 142 S1024 174 1215 442"/>
    <path class="mesh" d="M195 467 C416 253 535 206 774 327 S966 660 1140 806"/>
    <path class="thread" d="M60 98 C286 214 452 180 626 282 S888 488 1158 368"/>
    <path class="thread" d="M42 744 C230 640 390 740 578 596 S870 310 1160 505"/>
    <path class="orbit" d="M126 432 C286 184 873 114 1082 384 S789 742 472 671 S206 574 126 432Z"/>
    <circle class="pin pulse" cx="250" cy="275" r="3.5"/>
    <circle class="pin pulse" cx="470" cy="350" r="3"/>
    <circle class="pin-teal pulse" cx="626" cy="282" r="3.2"/>
    <circle class="pin pulse" cx="774" cy="327" r="3.5"/>
    <circle class="pin-teal pulse" cx="925" cy="430" r="3.5"/>
    <circle class="pin pulse" cx="578" cy="596" r="3"/>
    <circle class="pin pulse" cx="1065" cy="589" r="3.5"/>
    <circle class="pin pulse" cx="360" cy="665" r="2.6"/>
    <circle class="pin-teal pulse" cx="1050" cy="213" r="2.6"/>
  </g>

  <!-- Cloud services -->
  <g transform="translate(250 267)">
    <path class="icon-shell" d="M-31 22h59a16 16 0 0 0 0-32 25 25 0 0 0-48-5 19 19 0 0 0-11 37Z"/>
    <path class="icon" d="M-12 22v10m24-10v10m-24 0h24"/>
    <circle class="pin-teal pulse" cx="0" cy="-39" r="2.4"/>
  </g>

  <!-- Compute / infrastructure -->
  <g transform="translate(936 230)">
    <rect class="icon-shell" x="-30" y="-43" width="60" height="86" rx="6"/>
    <rect class="icon" x="-20" y="-31" width="40" height="17" rx="2"/>
    <rect class="icon" x="-20" y="-7" width="40" height="17" rx="2"/>
    <rect class="icon" x="-20" y="17" width="40" height="17" rx="2"/>
    <circle class="pin-teal" cx="13" cy="-22" r="1.8"/><circle class="pin-teal" cx="13" cy="2" r="1.8"/><circle class="pin-teal" cx="13" cy="26" r="1.8"/>
  </g>

  <!-- Network switch and connected endpoints -->
  <g transform="translate(615 438)">
    <rect class="icon-shell" x="-32" y="-24" width="64" height="48" rx="7"/>
    <path class="icon" d="M-17-7h34M-17 5h34M-11 16h22"/>
    <circle class="pin-teal" cx="-20" cy="-7" r="1.6"/><circle class="pin-teal" cx="-20" cy="5" r="1.6"/><circle class="pin-teal" cx="20" cy="-7" r="1.6"/><circle class="pin-teal" cx="20" cy="5" r="1.6"/>
  </g>

  <!-- Workplace / endpoint -->
  <g transform="translate(330 638)">
    <rect class="icon-shell" x="-35" y="-26" width="70" height="48" rx="5"/>
    <path class="icon" d="M-25-16h50v26h-50zM-9 22v9m18-9v9m-24 0h30"/>
    <circle class="pin pulse" cx="0" cy="-3" r="2.4"/>
  </g>

  <!-- Backup / recovery -->
  <g transform="translate(948 625)">
    <path class="icon-shell" d="M-37-24c0-8 17-14 37-14s37 6 37 14v48c0 8-17 14-37 14s-37-6-37-14Z"/>
    <path class="icon" d="M-37-24c0 8 17 14 37 14s37-6 37-14M-37 0c0 8 17 14 37 14s37-6 37-14m-9 3-7-7-7 7m7-7v18"/>
  </g>

  <!-- Small lights move in both directions around the site-wide mesh. -->
  <circle class="pin traveller" r="3.4"><animateMotion dur="17s" repeatCount="indefinite" path="M-60 595 C160 490 285 315 470 350 S750 560 925 430 S1110 280 1260 345"/></circle>
  <circle class="pin-teal traveller" r="3.2"><animateMotion dur="21s" begin="-8s" repeatCount="indefinite" path="M-45 238 C185 300 285 512 468 530 S750 298 916 238 S1112 158 1260 130"/></circle>
  <circle class="pin traveller" r="3.5"><animateMotion dur="24s" begin="-11s" repeatCount="indefinite" path="M118 28 C254 273 326 601 570 758 S850 805 1065 589"/></circle>
  <circle class="pin-teal traveller" r="3"><animateMotion dur="19s" begin="-5s" repeatCount="indefinite" path="M200 814 C360 665 508 230 714 142 S1024 174 1215 442"/></circle>
  <circle class="pin traveller" r="3.2"><animateMotion dur="26s" begin="-17s" repeatCount="indefinite" path="M195 467 C416 253 535 206 774 327 S966 660 1140 806"/></circle>
</svg>
